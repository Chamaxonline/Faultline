# Production stack for the Hetzner VM (see deploy/terraform/). Images are built
# and pushed to GHCR by .github/workflows/deploy.yml; this file just runs them.
#
# Required .env next to this file (not committed):
#   POSTGRES_PASSWORD=...
#   FAULTLINE_DOMAIN=faultline.internal.bistec.com
#   ALERTS_TEAMS_WEBHOOK_URL=...   (optional)
#   GHCR_IMAGE_PREFIX=ghcr.io/chamaxonline/faultline
#   AUTH_JWT_SIGNING_KEY=...              (long random string)
#   AUTH_DEFAULT_ADMIN_EMAIL=...          (bootstrap admin, only used on a fresh DB)
#   AUTH_DEFAULT_ADMIN_PASSWORD=...       (change after first login)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: faultline
      POSTGRES_USER: faultline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - faultline-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - faultline-redis:/data

  api:
    image: ${GHCR_IMAGE_PREFIX}-api:latest
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=faultline;Username=faultline;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      Auth__JwtSigningKey: ${AUTH_JWT_SIGNING_KEY}
      Auth__DefaultAdminEmail: ${AUTH_DEFAULT_ADMIN_EMAIL:-}
      Auth__DefaultAdminPassword: ${AUTH_DEFAULT_ADMIN_PASSWORD:-}

  worker:
    image: ${GHCR_IMAGE_PREFIX}-worker:latest
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=faultline;Username=faultline;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      Alerts__TeamsWebhookUrl: ${ALERTS_TEAMS_WEBHOOK_URL:-}
      Alerts__DashboardBaseUrl: https://${FAULTLINE_DOMAIN}

  dashboard:
    image: ${GHCR_IMAGE_PREFIX}-dashboard:latest
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      FAULTLINE_DOMAIN: ${FAULTLINE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - faultline-caddy-data:/data
    depends_on:
      - api
      - dashboard

volumes:
  faultline-postgres:
  faultline-redis:
  faultline-caddy-data:

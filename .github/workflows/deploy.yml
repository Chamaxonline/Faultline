name: Deploy

on:
  push:
    branches: [master]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker image names must be lowercase, but github.repository_owner isn't
      # necessarily — GitHub Actions expressions have no built-in case conversion,
      # so do it in a shell step instead.
      - name: Compute lowercase image prefix
        id: vars
        run: echo "prefix=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Faultline.Api/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.prefix }}/faultline-api:latest

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Faultline.Worker/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.prefix }}/faultline-worker:latest

      - name: Build and push dashboard
        uses: docker/build-push-action@v6
        with:
          context: dashboard
          push: true
          tags: ${{ steps.vars.outputs.prefix }}/faultline-dashboard:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # requires DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY secrets — see deploy/README.md.
    # Skips cleanly (rather than failing) until those are configured.
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/faultline
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

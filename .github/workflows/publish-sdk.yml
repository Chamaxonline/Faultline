name: Publish SDK

# Publishes Faultline.Contracts and Faultline.Sdk to GitHub Packages (NuGet) on
# every push to master. Versions are fixed in each .csproj — bump them before a
# push that should produce a new package; --skip-duplicate means re-pushing the
# same version is a no-op rather than a failure.
on:
  push:
    branches: [master]
    paths:
      - "src/Faultline.Contracts/**"
      - "src/Faultline.Sdk/**"
      - ".github/workflows/publish-sdk.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Pack
        run: |
          dotnet pack src/Faultline.Contracts/Faultline.Contracts.csproj -c Release -o ./nupkgs
          dotnet pack src/Faultline.Sdk/Faultline.Sdk.csproj -c Release -o ./nupkgs

      - name: Push to GitHub Packages
        run: |
          dotnet nuget add source --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          dotnet nuget push "./nupkgs/*.nupkg" --source github --skip-duplicate
